<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-Able - الكاميرا الذكية</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/components.css">

    <script src="config.js"></script>
</head>

<body>
    <!-- الشريط العلوي -->
    <header class="dashboard-header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-universal-access"></i>
                <span>All-Able</span>
            </div>

            <h2>الكاميرا الذكية</h2>

            <button class="back-btn-header" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-right"></i>
                رجوع
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="camera-main">
        <!-- اختيار الوضع -->
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="text">
                <i class="fas fa-file-alt"></i>
                <span>قراءة نص</span>
            </button>
            <button class="mode-btn" data-mode="object">
                <i class="fas fa-cube"></i>
                <span>تعرف على أشياء</span>
            </button>
            <button class="mode-btn" data-mode="medicine">
                <i class="fas fa-pills"></i>
                <span>أدوية</span>
            </button>
            <button class="mode-btn" data-mode="sign">
                <i class="fas fa-sign"></i>
                <span>لافتات</span>
            </button>
        </div>

        <!-- معاينة الكاميرا -->
        <div class="camera-preview">
            <video id="camera-video" autoplay playsinline></video>
            <canvas id="camera-canvas" style="display: none;"></canvas>

            <div class="camera-overlay">
                <div class="scan-line"></div>
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>

            <button class="capture-btn" id="capture-btn">
                <i class="fas fa-camera"></i>
                <span>التقاط</span>
            </button>
        </div>

        <!-- النتائج -->
        <div class="results-section" id="results-section" style="display: none;">
            <h3>النتائج</h3>
            <div id="results-content"></div>
            <div class="results-actions">
                <button class="btn btn-primary" id="read-results">
                    <i class="fas fa-volume-up"></i>
                    قراءة النتائج
                </button>
                <button class="btn btn-secondary" id="copy-results">
                    <i class="fas fa-copy"></i>
                    نسخ
                </button>
                <button class="btn btn-secondary" id="new-scan">
                    <i class="fas fa-redo"></i>
                    مسح جديد
                </button>
            </div>
        </div>

        <!-- السجل -->
        <div class="history-section">
            <h3>السجل</h3>
            <div id="scan-history" class="history-list">
                <p class="no-history">لا يوجد سجل</p>
            </div>
        </div>
    </main>

    <!-- زر الطوارئ -->
    <button class="emergency-fab" onclick="window.location.href='emergency.html'">
        <i class="fas fa-exclamation-triangle"></i>
    </button>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/accessibility.js"></script>
    <script src="js/ai-emotions.js"></script>
    <script src="js/camera.js"></script>

    <style>
        .dashboard-header {
            background: var(--bg-secondary);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--primary-color);
        }

        .back-btn-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--bg-tertiary);
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .back-btn-header:hover {
            background: var(--primary-color);
            color: white;
        }

        .camera-main {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--spacing-2xl);
        }

        .mode-selector {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-2xl);
            overflow-x: auto;
            padding-bottom: var(--spacing-sm);
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-lg);
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-base);
            min-width: 120px;
        }

        .mode-btn:hover,
        .mode-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            transform: translateY(-5px);
        }

        .mode-btn i {
            font-size: var(--font-size-2xl);
        }

        .camera-preview {
            position: relative;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: var(--spacing-2xl);
            aspect-ratio: 4/3;
        }

        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
            animation: scan 2s ease-in-out infinite;
        }

        @keyframes scan {

            0%,
            100% {
                transform: translateY(-100px);
            }

            50% {
                transform: translateY(100px);
            }
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid var(--primary-color);
        }

        .corner.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        .capture-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-xl);
            background: var(--gradient-primary);
            border: 4px solid white;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all var(--transition-base);
            width: 80px;
            height: 80px;
            justify-content: center;
        }

        .capture-btn:hover {
            transform: translateX(-50%) scale(1.1);
        }

        .capture-btn i {
            font-size: var(--font-size-2xl);
        }

        .capture-btn span {
            font-size: var(--font-size-xs);
        }

        .results-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }

        #results-content {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-xl);
            margin: var(--spacing-lg) 0;
            min-height: 100px;
            font-size: var(--font-size-lg);
            line-height: 1.8;
        }

        .results-actions {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .history-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .history-item {
            background: var(--bg-primary);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .history-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: var(--font-size-xl);
        }

        .history-content {
            flex: 1;
        }

        .history-text {
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .history-time {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }

        .no-history {
            text-align: center;
            color: var(--text-muted);
            padding: var(--spacing-2xl);
        }

        @media (max-width: 768px) {
            .camera-main {
                padding: var(--spacing-lg);
            }

            .results-actions {
                flex-direction: column;
            }

            .results-actions .btn {
                width: 100%;
            }
        }
    </style>
</body>

</html>
