<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-Able - لغة الإشارة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/components.css">

    <script src="config.js"></script>
</head>

<body>
    <!-- الشريط العلوي -->
    <header class="dashboard-header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-universal-access"></i>
                <span>All-Able</span>
            </div>

            <h2>لغة الإشارة</h2>

            <button class="back-btn-header" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-right"></i>
                رجوع
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="sign-main">
        <!-- مدخل النص -->
        <div class="text-input-section">
            <h3>أدخل النص لتحويله إلى لغة إشارة</h3>
            <div class="input-group">
                <textarea id="sign-text-input" class="sign-textarea" placeholder="اكتب النص هنا..." rows="4"></textarea>
            </div>
            <div class="input-actions">
                <button class="btn btn-primary btn-large" id="convert-to-sign">
                    <i class="fas fa-hands"></i>
                    تحويل إلى لغة إشارة
                </button>
                <button class="btn btn-secondary" id="voice-input-btn">
                    <i class="fas fa-microphone"></i>
                    إدخال صوتي
                </button>
                <button class="btn btn-secondary" id="clear-text-btn">
                    <i class="fas fa-trash"></i>
                    مسح
                </button>
            </div>
        </div>

        <!-- عرض لغة الإشارة -->
        <div class="sign-display-section" id="sign-display">
            <div class="sign-placeholder">
                <i class="fas fa-hands" style="font-size: 5rem; color: var(--text-muted);"></i>
                <p>سيتم عرض لغة الإشارة هنا</p>
            </div>
        </div>

        <!-- إعدادات العرض -->
        <div class="display-settings">
            <h3>إعدادات العرض</h3>
            <div class="settings-grid">
                <div class="setting-item">
                    <label>السرعة</label>
                    <input type="range" id="sign-speed" min="0.5" max="2" step="0.1" value="1">
                    <span id="speed-value">1x</span>
                </div>
                <div class="setting-item">
                    <label>الحجم</label>
                    <input type="range" id="sign-size" min="50" max="150" step="10" value="100">
                    <span id="size-value">100%</span>
                </div>
                <div class="setting-item">
                    <label>نوع لغة الإشارة</label>
                    <select id="sign-language-type" class="input-field">
                        <option value="arabic">عربية</option>
                        <option value="asl">أمريكية (ASL)</option>
                        <option value="bsl">بريطانية (BSL)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- الكلمات الشائعة -->
        <div class="common-phrases">
            <h3>كلمات وجمل شائعة</h3>
            <div class="phrases-grid">
                <button class="phrase-btn" data-phrase="مرحبا">مرحبا</button>
                <button class="phrase-btn" data-phrase="شكراً">شكراً</button>
                <button class="phrase-btn" data-phrase="من فضلك">من فضلك</button>
                <button class="phrase-btn" data-phrase="نعم">نعم</button>
                <button class="phrase-btn" data-phrase="لا">لا</button>
                <button class="phrase-btn" data-phrase="أحتاج مساعدة">أحتاج مساعدة</button>
                <button class="phrase-btn" data-phrase="كيف حالك">كيف حالك</button>
                <button class="phrase-btn" data-phrase="أنا بخير">أنا بخير</button>
            </div>
        </div>

        <!-- تعلم لغة الإشارة -->
        <div class="learning-section">
            <h3>تعلم لغة الإشارة</h3>
            <div class="learning-grid">
                <div class="learning-card">
                    <i class="fas fa-book"></i>
                    <h4>الأبجدية</h4>
                    <p>تعلم حروف لغة الإشارة</p>
                    <button class="btn btn-secondary">ابدأ التعلم</button>
                </div>
                <div class="learning-card">
                    <i class="fas fa-list"></i>
                    <h4>الأرقام</h4>
                    <p>تعلم الأرقام بلغة الإشارة</p>
                    <button class="btn btn-secondary">ابدأ التعلم</button>
                </div>
                <div class="learning-card">
                    <i class="fas fa-comments"></i>
                    <h4>محادثات يومية</h4>
                    <p>جمل وعبارات يومية</p>
                    <button class="btn btn-secondary">ابدأ التعلم</button>
                </div>
            </div>
        </div>
    </main>

    <!-- زر الطوارئ -->
    <button class="emergency-fab" onclick="window.location.href='emergency.html'">
        <i class="fas fa-exclamation-triangle"></i>
    </button>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/accessibility.js"></script>
    <script src="js/sign-language.js"></script>

    <style>
        .dashboard-header {
            background: var(--bg-secondary);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--primary-color);
        }

        .back-btn-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--bg-tertiary);
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .back-btn-header:hover {
            background: var(--primary-color);
            color: white;
        }

        .sign-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-2xl);
        }

        .text-input-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }

        .sign-textarea {
            width: 100%;
            min-height: 150px;
            padding: var(--spacing-lg);
            font-size: var(--font-size-lg);
            font-family: var(--font-family);
            background: var(--bg-primary);
            border: 2px solid var(--bg-tertiary);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            resize: vertical;
        }

        .sign-textarea:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .input-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .sign-display-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-3xl);
            margin-bottom: var(--spacing-2xl);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sign-placeholder {
            text-align: center;
            color: var(--text-muted);
        }

        .sign-animation {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-xl);
            position: relative;
        }

        /* تصميم الأفاتار (روبوت) */
        .sign-avatar {
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        /* الرأس */
        .sign-avatar::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: #e0f2fe;
            border: 8px solid var(--primary-color);
            border-radius: 40px;
            z-index: -1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* العينين */
        .sign-avatar::after {
            content: '●  ●';
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: var(--primary-color);
            letter-spacing: 40px;
            z-index: 0;
            white-space: nowrap;
        }

        /* الجسم (الإيموجي هو اليد/التعبير) */
        .sign-avatar-content {
            font-size: 8rem;
            z-index: 2;
            margin-top: 40px;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .sign-word {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--text-primary);
        }

        .display-settings {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-xl);
            margin-top: var(--spacing-lg);
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .setting-item label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .setting-item input[type="range"] {
            width: 100%;
        }

        .common-phrases {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }

        .phrases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .phrase-btn {
            padding: var(--spacing-lg);
            background: var(--bg-primary);
            border: 2px solid var(--bg-tertiary);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .phrase-btn:hover {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .learning-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
        }

        .learning-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-xl);
            margin-top: var(--spacing-lg);
        }

        .learning-card {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-2xl);
            text-align: center;
            transition: all var(--transition-base);
        }

        .learning-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .learning-card i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: var(--spacing-md);
        }

        .learning-card h4 {
            margin-bottom: var(--spacing-sm);
        }

        .learning-card p {
            color: var(--text-muted);
            margin-bottom: var(--spacing-lg);
        }

        @media (max-width: 768px) {
            .sign-main {
                padding: var(--spacing-lg);
            }

            .input-actions {
                flex-direction: column;
            }

            .input-actions .btn {
                width: 100%;
            }
        }
    </style>
</body>

</html>
