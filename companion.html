<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllAble - وضع المرافق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="config.js"></script>
</head>

<body class="companion-page">
    <!-- الهيدر -->
    <header class="page-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">
            <i class="fas fa-arrow-right"></i>
        </button>
        <h1>
            <i class="fas fa-user-friends"></i>
            وضع المرافق
        </h1>
    </header>

    <main class="companion-container">
        <!-- قسم تسجيل الدخول -->
        <section id="companion-login" class="companion-section">
            <div class="section-card">
                <div class="card-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>تسجيل دخول المرافق</h2>
                <p>للوصول إلى لوحة التحكم والإعدادات عن بُعد</p>

                <form id="companion-login-form" class="companion-form">
                    <div class="form-group">
                        <label for="companion-code">
                            <i class="fas fa-key"></i>
                            رمز الربط
                        </label>
                        <input type="text" id="companion-code" placeholder="أدخل رمز الربط" required>
                        <small>الرمز موجود في إعدادات المستخدم</small>
                    </div>

                    <div class="form-group">
                        <label for="companion-name">
                            <i class="fas fa-user"></i>
                            اسم المرافق
                        </label>
                        <input type="text" id="companion-name" placeholder="اسمك" required>
                    </div>

                    <div class="form-group">
                        <label for="companion-relation">
                            <i class="fas fa-heart"></i>
                            صلة القرابة
                        </label>
                        <select id="companion-relation" required>
                            <option value="">اختر...</option>
                            <option value="parent">ولي أمر</option>
                            <option value="sibling">أخ/أخت</option>
                            <option value="spouse">زوج/زوجة</option>
                            <option value="caregiver">مقدم رعاية</option>
                            <option value="teacher">معلم/معلمة</option>
                            <option value="friend">صديق/صديقة</option>
                            <option value="other">أخرى</option>
                        </select>
                    </div>

                    <button type="submit" class="primary-btn">
                        <i class="fas fa-sign-in-alt"></i>
                        تسجيل الدخول
                    </button>
                </form>

                <div class="generate-code-section">
                    <p>ليس لديك رمز؟</p>
                    <button class="secondary-btn" onclick="generateCompanionCode()">
                        <i class="fas fa-qrcode"></i>
                        إنشاء رمز جديد
                    </button>
                </div>
            </div>
        </section>

        <!-- لوحة تحكم المرافق (مخفية في البداية) -->
        <section id="companion-dashboard" class="companion-section hidden">
            <div class="welcome-card">
                <h2>مرحباً، <span id="companion-name-display"></span></h2>
                <p>أنت الآن متصل بحساب: <strong id="user-name-display"></strong></p>
            </div>

            <!-- بطاقات المعلومات -->
            <div class="info-cards">
                <div class="info-card">
                    <i class="fas fa-heartbeat"></i>
                    <h3>الحالة</h3>
                    <p id="user-status">نشط</p>
                </div>
                <div class="info-card">
                    <i class="fas fa-map-marker-alt"></i>
                    <h3>الموقع</h3>
                    <p id="user-location">جاري التحديد...</p>
                </div>
                <div class="info-card">
                    <i class="fas fa-clock"></i>
                    <h3>آخر نشاط</h3>
                    <p id="last-activity">منذ دقيقة</p>
                </div>
            </div>

            <!-- الإعدادات عن بُعد -->
            <div class="section-card">
                <h3>
                    <i class="fas fa-cog"></i>
                    الإعدادات عن بُعد
                </h3>

                <div class="remote-settings">
                    <div class="setting-item">
                        <label>
                            <i class="fas fa-font"></i>
                            حجم الخط
                        </label>
                        <select id="remote-font-size" onchange="updateRemoteSetting('fontSize', this.value)">
                            <option value="normal">عادي</option>
                            <option value="large">كبير</option>
                            <option value="xlarge">كبير جداً</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <label>
                            <i class="fas fa-volume-up"></i>
                            سرعة الصوت
                        </label>
                        <input type="range" id="remote-voice-speed" min="0.5" max="2" step="0.1" value="1"
                            onchange="updateRemoteSetting('voiceSpeed', this.value)">
                        <span id="voice-speed-value">1.0x</span>
                    </div>

                    <div class="setting-item">
                        <label>
                            <i class="fas fa-palette"></i>
                            الثيم
                        </label>
                        <select id="remote-theme" onchange="updateRemoteSetting('theme', this.value)">
                            <option value="hearing">إعاقة سمعية</option>
                            <option value="visual">إعاقة بصرية</option>
                            <option value="motor">إعاقة حركية</option>
                            <option value="cognitive">توحد/إعاقة ذهنية</option>
                            <option value="learning">صعوبات تعلم</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <label>
                            <i class="fas fa-bell"></i>
                            الإشعارات
                        </label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="remote-notifications" checked
                                onchange="updateRemoteSetting('notifications', this.checked)">
                            <label for="remote-notifications"></label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- سجل النشاطات -->
            <div class="section-card">
                <h3>
                    <i class="fas fa-history"></i>
                    سجل النشاطات
                </h3>
                <div id="activity-log" class="activity-log">
                    <!-- سيتم ملؤها ديناميكياً -->
                </div>
            </div>

            <!-- الطوارئ -->
            <div class="section-card emergency-card">
                <h3>
                    <i class="fas fa-exclamation-triangle"></i>
                    إشعارات الطوارئ
                </h3>
                <div id="emergency-alerts" class="emergency-alerts">
                    <p class="no-alerts">لا توجد إشعارات طوارئ</p>
                </div>
            </div>

            <!-- أزرار الإجراءات -->
            <div class="action-buttons">
                <button class="danger-btn" onclick="disconnectCompanion()">
                    <i class="fas fa-sign-out-alt"></i>
                    قطع الاتصال
                </button>
            </div>
        </section>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/companion.js"></script>
</body>

</html>
